<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Nino Green Marathon 2026</title>
    <!-- Razorpay Checkout SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #2e7d32;
            padding-bottom: 15px;
        }
        .header h1 {
            color: #2e7d32;
            font-size: 24px;
            margin-bottom: 5px;
        }
        .header p {
            color: #666;
            font-size: 14px;
        }
        .event-details {
            background-color: #e8f5e9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .event-details p {
            margin-bottom: 5px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }
        input:focus, select:focus {
            border-color: #2e7d32;
            outline: none;
        }
        .price-box {
            background: #fff3e0;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            color: #e65100;
            margin-bottom: 20px;
            font-size: 16px;
        }
        button {
            width: 100%;
            background-color: #2e7d32;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #1b5e20;
        }
        .footer-note {
            text-align: center;
            font-size: 12px;
            color: #777;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>El Nino Green Marathon 2026</h1>
        <p>Organized by Pasumai Ingarangal</p>
    </div>

    <div class="event-details">
        <p>📅 <strong>Date:</strong> October 11, 2026</p>
        <p>📍 <strong>Venue:</strong> K K Vidhyalaya School, Coimbatore</p>
    </div>

    <form id="registrationForm" onsubmit="handlePaymentAndRegister(event)">
        <div class="form-group">
            <label for="name">Full Name / முழு பெயர் *</label>
            <input type="text" id="name" required placeholder="Enter your full name">
        </div>

        <div class="form-group">
            <label for="email">Email Address / மின்னஞ்சல் *</label>
            <input type="email" id="email" required placeholder="Enter your email">
        </div>

        <div class="form-group">
            <label for="phone">Phone Number (WhatsApp) / மொபைல் எண் *</label>
            <input type="tel" id="phone" pattern="[0-9]{10}" required placeholder="10 Digit Mobile Number">
        </div>

        <div class="form-group">
            <label for="age">Age / வயது *</label>
            <input type="number" id="age" min="5" max="100" required placeholder="Enter your age">
        </div>

        <div class="form-group">
            <label for="gender">Gender / பாலினம் *</label>
            <select id="gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male / ஆண்</option>
                <option value="Female">Female / பெண்</option>
                <option value="Other">Other / இதர</option>
            </select>
        </div>

        <div class="form-group">
            <label for="distance">Category / பிரிவு *</label>
            <select id="distance" required>
                <option value="3KM Run">3 KM Run</option>
                <option value="5KM Run">5 KM Run</option>
                <option value="10KM Run">10 KM Run</option>
            </select>
        </div>

        <div class="form-group">
            <label for="tshirt">T-Shirt Size / டி-ஷர்ட் அளவு *</label>
            <select id="tshirt" required>
                <option value="">Select T-Shirt Size</option>
                <option value="S">S (36)</option>
                <option value="M">M (38)</option>
                <option value="L">L (40)</option>
                <option value="XL">XL (42)</option>
                <option value="XXL">XXL (44)</option>
            </select>
        </div>

        <div class="price-box">
            Registration Fee: ₹450
        </div>

        <button type="submit" id="submitBtn">PROCEED TO PAYMENT</button>
    </form>

    <div class="footer-note">
        Payment secured by Razorpay. Auto-confirmation via Email & WhatsApp after payment.
    </div>
</div>

<script>
    // ⚠️ கீழே உள்ள இந்த URL-ல் உன்னோட Google Apps Script Web App URL-ஐ ரீப்ளேஸ் பண்ணு
    const GOOGLE_SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL";

    function handlePaymentAndRegister(event) {
        event.preventDefault();

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "Processing Payment...";

        const formData = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            age: document.getElementById('age').value,
            gender: document.getElementById('gender').value,
            tshirt: document.getElementById('tshirt').value,
            distance: document.getElementById('distance').value
        };

        const options = {
            "key": "rzp_live_Tck0CfQHjRBsYh", // Live Key ID
            "amount": 45000, // ₹450 (in paise)
            "currency": "INR",
            "name": "El Nino Green Marathon 2026",
            "description": "Registration Fee - " + formData.distance,
            "handler": function (response) {
                // 100% Payment Success ஆன பிறகு மட்டுமே இது இயங்கும்
                formData.paymentId = response.razorpay_payment_id;
                
                btn.innerText = "Saving Registration...";

                fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(formData)
                })
                .then(res => res.json())
                .then(data => {
                    if(data.status === "success") {
                        alert("🎉 Registration Successful!\nYour Registration ID: " + data.regId + "\nConfirmation email & WhatsApp link sent!");
                        
                        // பேமெண்ட் முடிந்ததும் வாட்ஸ்அப்பிலும் தானாகவே கன்பர்மேஷன் மெசேஜ் ஓபன் ஆகும்
                        const waMsg = `Hi Team, I registered for El Nino Green Marathon 2026.%0A*Reg ID:* ${data.regId}%0A*Name:* ${formData.name}%0A*Payment ID:* ${formData.paymentId}`;
                        window.location.href = `https://wa.me/917904486274?text=${waMsg}`;
                    } else {
                        alert("Error saving data: " + data.message);
                        btn.disabled = false;
                        btn.innerText = "PROCEED TO PAYMENT";
                    }
                })
                .catch(err => {
                    alert("Network Error! Please contact support with Payment ID: " + formData.paymentId);
                    btn.disabled = false;
                    btn.innerText = "PROCEED TO PAYMENT";
                });
            },
            "modal": {
                "ondismiss": function() {
                    btn.disabled = false;
                    btn.innerText = "PROCEED TO PAYMENT";
                }
            },
            "prefill": {
                "name": formData.name,
                "email": formData.email,
                "contact": formData.phone
            },
            "theme": {
                "color": "#2e7d32"
            }
        };

        const rzp1 = new Razorpay(options);
        rzp1.open();
    }
</script>

</body>
</html>
